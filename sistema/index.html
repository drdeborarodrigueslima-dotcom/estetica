<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#b5707c; --rose-d:#94525e; --rose-l:#f3e3e6; --rose-ll:#faf2f3;
  --ink:#2f2a2b; --mute:#7a7072; --line:#eadfe1; --bg:#fbf8f7; --card:#fff;
  --ok:#3f8a62; --ok-l:#e3f2ea; --warn:#b7791f; --warn-l:#fbf0dc; --bad:#b84a4a; --bad-l:#f8e1e1;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rose-d)}
.app{display:flex;min-height:100vh}
/* Navegação */
.nav{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.marca-logo{padding:0 8px 18px}.marca-logo img{width:100%;max-width:190px;display:block}
@media (max-width:899px){.marca-logo{padding:0 6px 0 0;flex:none}.marca-logo img{height:40px;width:auto}}
.marca{font-family:"Great Vibes",cursive;font-size:34px;color:var(--rose-d);line-height:1;padding:0 10px 2px}
.marca-sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding:0 12px 18px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;color:var(--mute)}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--rose-ll);color:var(--ink)}
.nav button.ativo{background:var(--rose-l);color:var(--rose-d)}
.nav .rodape{margin-top:auto;font-size:12px;color:var(--mute);padding:10px 12px;line-height:1.5;word-break:break-all}
.demo-tag{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12px;margin:0 4px 8px;line-height:1.4}
main{flex:1;min-width:0;padding:28px 32px 80px;max-width:1440px}
@media (max-width:899px){
  .app{flex-direction:column}
  .nav{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .marca{font-size:26px;padding:0 8px 0 4px;flex:none}
  .marca-sub,.nav .rodape,.demo-tag{display:none}
  .nav button{flex:none;padding:9px 11px;font-size:14px;gap:6px}
  .nav button svg{width:18px;height:18px}
  main{padding:18px 16px 80px}
}
/* Tipografia e blocos */
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topo .sub{color:var(--mute);margin-top:4px}
.voltar{border:0;background:none;color:var(--mute);cursor:pointer;padding:0;margin-bottom:8px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi .rot{font-size:13px;color:var(--mute);margin-bottom:8px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .det{font-size:12px;color:var(--mute);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}.small{font-size:13px}
.right{text-align:right}
/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);min-height:44px}
.btn:hover{border-color:var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.pri:hover{background:var(--rose-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.perigo{color:var(--bad)}
.btn.peq{padding:7px 12px;min-height:36px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;pointer-events:none}
/* Tabelas / listas */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.tabela td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabela tr.click{cursor:pointer}.tabela tr.click:hover td{background:var(--rose-ll)}
.tabela td.num,.tabela th.num{text-align:right;white-space:nowrap}
.rolagem{overflow-x:auto;margin:0 -20px;padding:0 20px}
.vazio{padding:28px;text-align:center;color:var(--mute)}
.selo{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-Rascunho{background:#eee;color:#666}.s-Enviado{background:var(--warn-l);color:var(--warn)}
.s-Aprovado{background:var(--ok-l);color:var(--ok)}.s-Recusado{background:var(--bad-l);color:var(--bad)}
.alerta{background:var(--bad-l);color:var(--bad)}
/* Formulários */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label,.rot-campo{font-size:13px;font-weight:600;color:#5c5254}
.campo input,.campo select,.campo textarea,input.busca{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:44px;width:100%}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,input.busca:focus{outline:2px solid var(--rose-l);border-color:var(--rose)}
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
@media (max-width:700px){.form-grid{grid-template-columns:1fr 1fr}.c2,.c3{grid-column:span 1}.c4,.c6{grid-column:span 2}}
.pergunta{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pergunta:last-child{border-bottom:0}
.pergunta .tit{font-weight:600}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes label{position:relative}
.opcoes input{position:absolute;opacity:0;pointer-events:none}
.opcoes span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:9px 18px;cursor:pointer;background:#fff;font-weight:500;min-width:64px;text-align:center}
.opcoes input:checked+span{background:var(--rose);border-color:var(--rose);color:#fff}
.secao-tit{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-d);font-weight:700;margin:6px 0 2px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}.kpi.box .val{font-size:22px}.kpi.box.verde{background:#eef6f0;border-color:#cfe5d6}.kpi.box.verde .val{color:var(--ok)}
.mini-tit{font-size:14px;margin:0 0 6px}
.graf-linha{width:100%;height:auto;display:block}.graf-linha .gl{stroke:var(--line);stroke-dasharray:3 4}.graf-linha .gt{font-size:10px;fill:var(--mute)}
.vbom{color:var(--ok);font-weight:700}.vruim{color:var(--bad);font-weight:700}
.calc{padding:12px 0;font-weight:600}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-block;background:var(--rose-ll)}.avatar.ini{display:inline-grid;place-items:center;background:linear-gradient(135deg,#f3e3e6,#ead2b0);color:var(--rose-d);font-weight:700;letter-spacing:.02em}
.cli-ident{display:flex;align-items:center;gap:18px}.avatar-btn{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--rose-l)}.avatar-btn .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}.avatar-btn .cam svg{width:15px;height:15px}
.cli-linha{display:flex;align-items:center;gap:12px}
.foto-campo{display:flex;gap:18px;align-items:center;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.foto-modal{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.opc-sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}.opc-sw input{width:18px;height:18px;accent-color:var(--rose)}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}.chips-sel .opc{border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;background:#fff;font-size:14px;user-select:none}.chips-sel .opc input{display:none}.chips-sel .opc.on{background:var(--rose);border-color:var(--rose);color:#fff}
.declara{background:var(--rose-ll);border:1px solid var(--rose-l);border-radius:12px;padding:16px;font-weight:600;line-height:1.5}
.itens-orc .item{display:grid;grid-template-columns:minmax(0,1fr) 90px 130px 120px 44px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:700px){.itens-orc .item{grid-template-columns:1fr 1fr;}.itens-orc .item .campo:first-child{grid-column:span 2}}
.total-box{display:flex;justify-content:flex-end;gap:28px;font-size:15px;padding-top:12px;flex-wrap:wrap}
.total-box b{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--rose-ll);border:1px solid var(--rose-l);color:var(--rose-d);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.chip.alerta{background:var(--bad-l);border-color:#f0c9c9;color:var(--bad)}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:14px}
.dl dt{color:var(--mute)}.dl dd{margin:0;word-break:break-word}
.abas{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.abas button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.abas button.ativo{color:var(--rose-d);border-bottom-color:var(--rose)}
/* Gráfico */
.barras{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.barras .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.barras .par{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.barras .b{width:40%;max-width:26px;border-radius:6px 6px 2px 2px;min-height:2px}
.barras .b1{background:var(--rose-l)}.barras .b2{background:var(--rose)}
.barras .m{font-size:12px;color:var(--mute)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
/* Financeiro */
.faixa-atraso{display:flex;gap:12px;align-items:center;background:var(--bad-l);color:#7d2f2f;border:1px solid #efc4c4;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;cursor:pointer;font-size:14px}
.faixa-atraso svg{width:20px;height:20px;flex:none;color:var(--bad)}
.kpis-fin{margin-bottom:16px}
.kpi.destaque{background:linear-gradient(135deg,#94525e,#b5707c);color:#fff;border:none}.kpi.destaque .rot,.kpi.destaque .det,.kpi.destaque .mute{color:#f6dfe3}
.kpi.ruim .val{color:var(--bad)}
.var{font-weight:700}.var.up{color:var(--ok)}.var.down{color:var(--bad)}.kpi.destaque .var{color:#fff}
.fin-formas{grid-template-columns:2fr 1fr;margin-bottom:16px}
.fin-atraso{grid-template-columns:3fr 2fr}@media (max-width:1000px){.fin-atraso{grid-template-columns:1fr}}
.formas-wrap{display:flex;gap:28px;align-items:center}
.donut{width:190px;height:190px;flex:none}.donut .d1{font-size:9px;fill:var(--mute)}.donut .d2{font-size:13px;font-weight:700;fill:var(--ink)}
.formas-lista{flex:1;min-width:0}
.fl{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.fl:last-child{border:0}
.fl i{width:12px;height:12px;border-radius:4px;flex:none}
.fl .fk{flex:1;font-weight:600}.fl small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.fl .fv{text-align:right;font-weight:700}
.card.mini{padding:16px 18px}.mini-formas{gap:10px}.mini-formas .card.mini{padding:12px 16px}.mini-formas .val{font-size:20px}.card.mini .rot{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}.card.mini .rot svg{width:18px;height:18px;color:var(--rose)}
.card.mini .val{font-size:22px;font-weight:700}.card.mini .det{font-size:12px;color:var(--mute);margin-top:2px}
.pilhas{display:flex;align-items:flex-end;gap:10px;height:220px;padding-top:24px;margin-top:8px}
.pilhas .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:6px}
.pilhas .pilha{width:70%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden;min-height:2px}
.pilhas .vt{font-size:11px;color:var(--mute);white-space:nowrap}.pilhas .m{font-size:12px;color:var(--mute)}
.hbar .hb{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:7px 0}
.hbar .hk{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ht{height:10px;background:var(--rose-ll);border-radius:99px;overflow:hidden}.hbar .ht i{display:block;height:100%;background:linear-gradient(90deg,#c9a063,#b5707c);border-radius:99px}
.destaques-dem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 16px}.dd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}.dd .rot{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.dd b{font-size:16px}.dd.alta{background:#fff7ec;border-color:#f1dcb8}
.tabela.dem .ht{display:block;height:10px;background:var(--rose-ll);border-radius:99px;overflow:hidden}.tabela.dem .ht i{display:block;height:100%;background:linear-gradient(90deg,#c9a063,#b5707c);border-radius:99px}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;width:72px}.spark i{flex:1;background:var(--rose);border-radius:2px 2px 0 0}
@media (max-width:760px){.destaques-dem{grid-template-columns:1fr}}
.pos{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rose-ll);color:var(--rose-d);font-size:12px;font-weight:700;margin-right:8px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}.filtro.ativo{background:var(--rose);border-color:var(--rose);color:#fff}
.total-lista{text-align:right;padding-top:12px;font-size:14px;color:var(--mute)}.total-lista b{color:var(--ink);font-size:16px}
.parcelas .st{font-size:12px}
@media (max-width:1000px){.fin-formas{grid-template-columns:1fr}.formas-wrap{flex-direction:column;align-items:stretch}.donut{margin:0 auto}}
@media (max-width:640px){.pilhas .vt{display:none}.hbar .hb{grid-template-columns:1fr auto}.hbar .ht{grid-column:span 2;order:3}}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Sobreposições */
.veu{position:fixed;inset:0;background:rgba(47,42,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.modal.grande{max-width:900px}
.modal .acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.assin{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column}
.assin .cab{padding:18px 22px 10px;max-width:900px;margin:0 auto;width:100%}
.assin .texto{color:#5c5254;line-height:1.5;font-size:15px;max-height:22vh;overflow:auto}
.assin .area{flex:1;margin:10px 22px;border:2px dashed var(--rose);border-radius:16px;position:relative;background:var(--rose-ll);min-height:200px}
.assin canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.assin .linha{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #c9a9af;pointer-events:none}
.assin .dica{position:absolute;left:8%;bottom:calc(28% - 26px);font-size:13px;color:var(--mute);pointer-events:none}
.assin .pe{display:flex;justify-content:space-between;gap:10px;padding:12px 22px 22px;flex-wrap:wrap}
.carregando{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--rose-d)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--rose-l);border-top-color:var(--rose);animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:80;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.aviso.erro{background:var(--bad)}
iframe.previa{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.lista-simples>div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.lista-simples>div:last-child{border-bottom:0}
.hidden{display:none!important}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.galeria .f{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.galeria .f .im{aspect-ratio:1/1;background:var(--rose-ll) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--rose-d);font-weight:700;font-size:13px}
.galeria .f .tx{padding:8px 10px;font-size:12px;line-height:1.35}
.galeria .f .tx b{display:block;font-size:13px}
.grupo-tit{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-d);font-weight:700;margin:18px 0 10px}
.grupo-tit:first-child{margin-top:0}
.tempo{position:relative;padding-left:22px}
.tempo:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--rose-l)}
.tempo .ev{position:relative;padding:0 0 18px;cursor:pointer}
.tempo .ev:before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--rose)}
.tempo .ev .d{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ================================================================
   Assinatura (dedo ou caneta no tablet)
   ================================================================ */
function coletarAssinatura(op) {
  return new Promise(function (resolve) {
    var el = document.createElement('div'); el.className = 'assin';
    el.innerHTML = '<div class="cab"><div class="secao-tit">Assinatura da cliente</div><h2 style="margin:4px 0 8px">' + esc(op.titulo) + '</h2><div class="texto">' + (op.texto || '') + '</div></div>' +
      '<div class="area"><div class="linha"></div><div class="dica">' + esc(op.nome || '') + ' · assine acima da linha</div><canvas></canvas></div>' +
      '<div class="pe"><button class="btn" id="canc">Cancelar</button><div class="row"><button class="btn" id="limpar">Limpar</button><button class="btn ok" id="conf">' + ICON.caneta + ' Confirmar assinatura</button></div></div>';
    document.body.appendChild(el);
    document.documentElement.style.overflow = 'hidden';
    var cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), area = el.querySelector('.area');
    var dpr = Math.max(1, window.devicePixelRatio || 1), tracos = [], atual = null, vazio = true;
    function ajustar() { var r = area.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; redesenhar(); }
    function largura(pt) { return (pt.tipo === 'pen' ? 1.2 + 2.6 * (pt.p || .5) : 2.6) * dpr; }
    function seg(a, b) { ctx.lineWidth = (largura(a) + largura(b)) / 2; ctx.beginPath(); ctx.moveTo(a.x * dpr, a.y * dpr); ctx.lineTo(b.x * dpr, b.y * dpr); ctx.stroke(); }
    function redesenhar() { ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2a52';
      tracos.forEach(function (t) { if (t.length === 1) { ctx.beginPath(); ctx.arc(t[0].x * dpr, t[0].y * dpr, largura(t[0]) / 2, 0, 7); ctx.fillStyle = '#1d2a52'; ctx.fill(); } for (var i = 1; i < t.length; i++) seg(t[i - 1], t[i]); }); }
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure, tipo: e.pointerType }; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.setPointerCapture(e.pointerId); atual = [pt(e)]; tracos.push(atual); vazio = false; redesenhar(); });
    cv.addEventListener('pointermove', function (e) { if (!atual) return; e.preventDefault(); var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; if (!evs.length) evs = [e]; evs.forEach(function (ev) { var p = pt(ev); seg(atual[atual.length - 1], p); atual.push(p); }); });
    function fim() { atual = null; }
    cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
    window.addEventListener('resize', ajustar);
    setTimeout(ajustar, 30);
    function fechar(v) { window.removeEventListener('resize', ajustar); document.documentElement.style.overflow = ''; el.remove(); resolve(v); }
    el.querySelector('#canc').onclick = function () { fechar(null); };
    el.querySelector('#limpar').onclick = function () { tracos = []; vazio = true; redesenhar(); };
    el.querySelector('#conf').onclick = function () {
      if (vazio) { aviso('Peça para a cliente assinar antes de confirmar.', true); return; }
      // recorta a assinatura e gera um PNG leve
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      tracos.forEach(function (t) { t.forEach(function (q) { minX = Math.min(minX, q.x); minY = Math.min(minY, q.y); maxX = Math.max(maxX, q.x); maxY = Math.max(maxY, q.y); }); });
      var pad = 12, w = maxX - minX + pad * 2, h = maxY - minY + pad * 2;
      var esc2 = Math.min(1, 700 / w) * 2;
      var out = document.createElement('canvas'); out.width = Math.max(10, w * esc2); out.height = Math.max(10, h * esc2);
      var o = out.getContext('2d'); o.lineCap = 'round'; o.lineJoin = 'round'; o.strokeStyle = o.fillStyle = '#1d2a52';
      tracos.forEach(function (t) {
        function X(q) { return (q.x - minX + pad) * esc2; } function Y(q) { return (q.y - minY + pad) * esc2; }
        if (t.length === 1) { o.beginPath(); o.arc(X(t[0]), Y(t[0]), largura(t[0]) / dpr * esc2 / 2, 0, 7); o.fill(); }
        for (var i = 1; i < t.length; i++) { o.lineWidth = (largura(t[i - 1]) + largura(t[i])) / 2 / dpr * esc2; o.beginPath(); o.moveTo(X(t[i - 1]), Y(t[i - 1])); o.lineTo(X(t[i]), Y(t[i])); o.stroke(); }
      });
      fechar(out.toDataURL('image/png'));
    };
  });
}

function campo(nome, rot, valor, tipo, cls, extra) {
  var v = esc(valor == null ? '' : valor);
  var inp = tipo === 'area' ? '<textarea name="' + nome + '" ' + (extra || '') + '>' + v + '</textarea>' : '<input name="' + nome + '" type="' + (tipo || 'text') + '" value="' + v + '" ' + (extra || '') + '>';
  return '<div class="campo ' + (cls || '') + '"><label>' + rot + '</label>' + inp + '</div>';
}
function opcoes(nome, lista, valor) {
  return '<div class="opcoes">' + lista.map(function (o) { return '<label><input type="radio" name="' + nome + '" value="' + esc(o) + '"' + (valor === o ? ' checked' : '') + '><span>' + esc(o) + '</span></label>'; }).join('') + '</div>';
}
function lerForm(el) {
  var o = {};
  el.querySelectorAll('input,select,textarea').forEach(function (i) {
    if (!i.name) return;
    if (i.type === 'radio') { if (i.checked) o[i.name] = i.value; else if (!(i.name in o)) o[i.name] = ''; return; }
    if (i.type === 'checkbox') { o[i.name] = i.checked; return; }
    o[i.name] = i.value.trim();
  });
  return o;
}
// Permite desmarcar uma opção tocando de novo
function opcoesDesmarcaveis(raiz) {
  raiz.querySelectorAll('.opcoes input').forEach(function (i) {
    i.addEventListener('click', function () { if (i._estava) { i.checked = false; } raiz.querySelectorAll('input[name="' + i.name + '"]').forEach(function (x) { x._estava = x.checked; }); });
    i._estava = i.checked;
  });
}

/* ---------- Foto de identificação ---------- */
function iniciais(n) { var p = String(n || '').replace(/\s*\(.*\)/, '').trim().split(/\s+/); return ((p[0] || '')[0] || '') + (p.length > 1 ? p[p.length - 1][0] : ''); }
function avatar(c, tam) { tam = tam || 40; return c && c.foto ? '<img class="avatar" src="' + c.foto + '" style="width:' + tam + 'px;height:' + tam + 'px" alt="">' : '<span class="avatar ini" style="width:' + tam + 'px;height:' + tam + 'px;font-size:' + Math.round(tam * 0.38) + 'px">' + esc(iniciais(c && c.nome).toUpperCase()) + '</span>'; }
function fotoQuadrada(dataUrl, lado, q) {
  return new Promise(function (ok) { var img = new Image(); img.onload = function () { var m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = lado; var x = c.getContext('2d'); x.drawImage(img, (img.width - m) / 2, Math.max(0, (img.height - m) / 2 - m * 0.08), m, m, 0, 0, lado, lado); ok(c.toDataURL('image/jpeg', q)); }; img.onerror = function () { ok(null); }; img.src = dataUrl; });
}
function lerFotoId(inp) { var f = inp.files && inp.files[0]; if (!f) return Promise.resolve(null); return lerArquivoLocal(f).then(function (u) { return Promise.all([fotoQuadrada(u, 240, 0.78), redimensionar(u, 1400, 0.85)]); }); }

  var nova = null;

  mm.querySelector('#fc').onchange = function () { pegar(this); }; mm.querySelector('#fa2').onchange = function () { pegar(this); };
  var rem = mm.querySelector('#rem'); if (rem) rem.onclick = function () { mm.fechar(); tarefa('Salvando…', chamar('salvar', { tabela: 'clientes', registro: { id: c.id, foto: '' } })).then(function (r) { substituir('clientes', r); recarregar(); }); };

      return chamar('arquivo', { registro: reg, base64: (nova[1] || nova[0]).split(',')[1], mime: 'image/jpeg', nome: 'Foto de identificação - ' + c.nome + ' - ' + hoje() + '.jpg' }).then(function (x) { DB.arquivos = DB.arquivos || []; DB.arquivos.push(x.arquivo); }); }))

  h += '<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Procedimentos e preços sugeridos</h2><button class="btn peq" id="novoProc">' + ICON.mais + ' Adicionar</button></div><div class="lista-simples">' +
    DB.procedimentos.slice().sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); }).map(function (x) { return '<div><span>' + esc(x.nome) + '</span><span class="row"><b>' + brl(x.preco) + '</b><button class="btn peq" data-proc="' + x.id + '">Editar</button></span></div>'; }).join('') + '</div></div>';
  h += '<div class="card"><h2>Onde ficam os dados</h2>' + (EM_GOOGLE ? '<p>Tudo fica no Google da Débora: os cadastros numa planilha e os PDFs assinados numa pasta do Drive, separados por cliente.</p><div class="row"><a class="btn" target="_blank" href="' + esc(DB.links.planilha) + '">Abrir planilha</a><a class="btn" target="_blank" href="' + esc(DB.links.pasta) + '">Abrir pasta no Drive</a></div>' :
    '<p>Você está no <b>modo demonstração</b>: os dados ficam só neste navegador. Depois de instalado no Google da Débora, tudo vai para a planilha e o Drive dela.</p><button class="btn perigo" id="zerar">Apagar dados de demonstração</button>') + '</div>';
  return h;
};
ACOES.config = function (m) {
  m.querySelector('#salvarCfg').onclick = function () { var d = lerForm(m.querySelector('#fc')); tarefa('Salvando…', chamar('salvarConfig', d)).then(function (r) { DB.config = r; aviso('Dados salvos.'); recarregar(); }); };
  m.querySelector('#novoProc').onclick = function () { formProc({}); };
  m.querySelectorAll('[data-proc]').forEach(function (b) { b.onclick = function () { formProc(porId(DB.procedimentos, b.dataset.proc)); }; });
  var z = m.querySelector('#zerar'); if (z) z.onclick = function () { confirmar('Apagar os dados de demonstração e começar do zero com exemplos?', 'Apagar').then(function () { Demo.zerar(); iniciar(); }); };
};
function formProc(x) {
  var mm = modal('<h2>' + (x.id ? 'Editar procedimento' : 'Novo procedimento') + '</h2><div class="form-grid" id="fpr">' + campo('nome', 'Nome', x.nome, 'text', 'c4') + campo('preco', 'Preço sugerido (R$)', x.preco ? String(x.preco).replace('.', ',') : '', 'text', 'c2', 'inputmode="decimal"') + campo('descricao', 'Descrição (opcional)', x.descricao, 'area', 'c6') + '</div><div class="acoes">' + (x.id ? '<button class="btn perigo" id="exc" style="margin-right:auto">Excluir</button>' : '') + '<button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>');
  mm.querySelector('#ok').onclick = function () {
    var d = lerForm(mm.querySelector('#fpr')); if (!d.nome) { aviso('Informe o nome.', true); return; }
    var r = { nome: d.nome, preco: num(d.preco), descricao: d.descricao, ativo: 'sim' }; if (x.id) r.id = x.id;
    mm.fechar(); tarefa('Salvando…', chamar('salvar', { tabela: 'procedimentos', registro: r })).then(function (y) { substituir('procedimentos', y); recarregar(); });
  };
  var ex = mm.querySelector('#exc'); if (ex) ex.onclick = function () { mm.fechar(); tarefa('Excluindo…', chamar('excluir', { tabela: 'procedimentos', id: x.id })).then(function () { DB.procedimentos = DB.procedimentos.filter(function (y) { return y.id !== x.id; }); recarregar(); }); };
}

/* ================================================================
   Evolução, fotos e documentos
   ================================================================ */
function linhaDoTempo(sess) {
  if (!sess.length) return '<div class="vazio">Nenhum atendimento registrado ainda.</div>';
  return '<div class="tempo">' + sess.map(function (s) {
    var pg = DB.pagamentos.filter(function (x) { return x.sessaoId === s.id; }).reduce(function (a, x) { return a + num(x.valor); }, 0);
    var nf = (DB.arquivos || []).filter(function (x) { return x.sessaoId === s.id; }).length;
    return '<div class="ev" data-abrir="sessaoDet:' + s.id + '"><div class="d">' + dataBR(s.data) + (s.assinaturaId ? ' · <span style="color:var(--ok)">assinado</span>' : ' · <span style="color:var(--warn)">sem assinatura</span>') + (pg ? ' · pago ' + brl(pg) : '') + (nf ? ' · ' + nf + ' foto(s)' : '') + '</div>' +
      '<div class="t">' + esc(s.procedimento) + (s.area ? ' <span class="mute" style="font-weight:500">· ' + esc(s.area) + '</span>' : '') + '</div>' +
      (s.produtos || s.obs ? '<div class="o">' + esc([s.produtos, s.obs].filter(Boolean).join('\n')) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}
var TIPOS_ARQ = ['Antes', 'Depois', 'Receita', 'Foto', 'Exame', 'Foto de identificação', 'Ficha assinada (papel)', 'Orçamento assinado (papel)', 'Atendimento assinado (papel)', 'Outro'];
function galeria(lista) {
  if (!lista.length) return '<div class="vazio">Nenhuma foto ou documento ainda.</div>';
  var grupos = {};
  lista.forEach(function (a) { (grupos[a.tipo || 'Outro'] = grupos[a.tipo || 'Outro'] || []).push(a); });
  return TIPOS_ARQ.filter(function (t) { return grupos[t]; }).concat(Object.keys(grupos).filter(function (t) { return TIPOS_ARQ.indexOf(t) < 0; })).map(function (t) {
    return '<div class="grupo-tit">' + esc(t) + ' (' + grupos[t].length + ')</div><div class="galeria">' + grupos[t].map(function (a) {
      var im = a.miniatura ? '<div class="im" style="background-image:url(\'' + a.miniatura + '\')"></div>' : '<div class="im">' + (/pdf/.test(a.mime || '') ? 'PDF' : 'ARQUIVO') + '</div>';
      return '<div class="f" data-arq="' + a.id + '">' + im + '<div class="tx"><b>' + dataBR(a.data) + '</b>' + esc(a.descricao || '') + '</div></div>';
    }).join('') + '</div>';
  }).join('');
}
function ligarGaleria(m) {
  m.querySelectorAll('[data-arq]').forEach(function (el) { el.onclick = function () { verArquivo(porId(DB.arquivos, el.dataset.arq)); }; });
}
function verArquivo(a) {
  if (!a) return;
  var completo = (Demo.completos || {})[a.id];
  var url = EM_GOOGLE && a.arquivoId !== 'demo' ? 'https://drive.google.com/file/d/' + a.arquivoId + '/view' : '';
  var vis = completo && /^data:image/.test(completo) ? '<img src="' + completo + '" style="max-width:100%;border-radius:10px">' : (a.miniatura ? '<img src="' + a.miniatura + '" style="max-width:100%;border-radius:10px">' : '<div class="vazio">Pré-visualização indisponível.</div>');
  var mm = modal('<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2 style="margin:0">' + esc(a.tipo) + '</h2><div class="small mute">' + dataBR(a.data) + (a.descricao ? ' · ' + esc(a.descricao) : '') + '</div></div><button class="btn peq" data-fechar>Fechar</button></div>' +
    '<div style="text-align:center">' + vis + '</div><div class="acoes"><button class="btn perigo" id="exc" style="margin-right:auto">Excluir</button>' + (url ? '<a class="btn pri" target="_blank" href="' + url + '">Abrir no Google Drive</a>' : '') + '</div>', true);
  mm.querySelector('#exc').onclick = function () { mm.fechar(); confirmar('Excluir este arquivo?', 'Excluir').then(function () { tarefa('Excluindo…', chamar('excluir', { tabela: 'arquivos', id: a.id })).then(function () { DB.arquivos = DB.arquivos.filter(function (x) { return x.id !== a.id; }); recarregar(); }); }); };
}
function lerArquivoLocal(file) {
  return new Promise(function (ok, falha) {
    var fr = new FileReader();
    fr.onload = function () { ok(fr.result); };
    fr.onerror = function () { falha(new Error('Não foi possível ler o arquivo.')); };
    fr.readAsDataURL(file);
  });
}
function redimensionar(dataUrl, max, qualidade) {
  return new Promise(function (ok) {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = function () { ok(null); };
    img.src = dataUrl;
  });
}
/** op = { clienteId, sessaoId, tipo, descricao, camera, travarTipo, vincular } */
function enviarArquivo(op) {
  var cli = porId(DB.clientes, op.clienteId) || {};
  var mm = modal('<h2>' + (op.camera ? 'Tirar foto' : 'Enviar foto ou documento') + '</h2><p class="small mute" style="margin-top:-6px">Fica guardado na pasta de ' + esc(cli.nome || 'cliente') + ' no Google Drive.</p>' +
    '<div class="form-grid" id="fa"><div class="campo c3"><label>Tipo</label><select name="tipo"' + (op.travarTipo ? ' disabled' : '') + '>' + TIPOS_ARQ.map(function (t) { return '<option' + (t === op.tipo ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    campo('data', 'Data', hoje(), 'date', 'c3') + campo('descricao', 'Descrição', op.descricao || '', 'text', 'c6', 'placeholder="Ex.: rosto frontal, receita Mounjaro 5 mg, abdômen lateral"') + '</div>' +
    '<div class="zona-up" style="margin-top:14px"><div class="row" style="justify-content:center"><label class="btn pri">' + ICON.camera + ' Câmera<input type="file" accept="image/*" capture="environment" id="cam" hidden></label><label class="btn">' + ICON.doc + ' Escolher arquivo<input type="file" accept="image/*,application/pdf" id="arq" hidden></label></div><div id="prev" class="small mute" style="margin-top:10px">Nenhum arquivo escolhido.</div></div>' +
    '<div class="acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="ok" disabled>Salvar</button></div>');
  var escolhido = null;
  function pegar(inp) {
    var f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024) { aviso('Arquivo muito grande (máximo 20 MB).', true); return; }
    lerArquivoLocal(f).then(function (url) {
      var eImg = /^image\//.test(f.type);
      var prom = eImg ? Promise.all([redimensionar(url, 1800, 0.85), redimensionar(url, 320, 0.7)]) : Promise.resolve([url, null]);
      return prom.then(function (r) {
        escolhido = { dados: r[0] || url, mini: r[1], mime: eImg ? 'image/jpeg' : (f.type || 'application/pdf'), nome: f.name.replace(/\.[^.]+$/, '') + (eImg ? '.jpg' : (/\.[^.]+$/.exec(f.name) || [''])[0]) };
        mm.querySelector('#prev').innerHTML = esc(f.name) + (r[1] ? '<br><img src="' + r[1] + '">' : '');
        mm.querySelector('#ok').disabled = false;
      });
    });
  }
  mm.querySelector('#cam').onchange = function () { pegar(this); };
  mm.querySelector('#arq').onchange = function () { pegar(this); };
  if (op.camera) setTimeout(function () { try { mm.querySelector('#cam').click(); } catch (e) {} }, 50);
  mm.querySelector('#ok').onclick = function () {
    if (!escolhido) return;
    var d = lerForm(mm.querySelector('#fa'));
    var tipo = op.travarTipo ? op.tipo : d.tipo;
    var reg = { clienteId: op.clienteId, clienteNome: cli.nome, sessaoId: op.sessaoId || '', tipo: tipo, descricao: d.descricao, data: d.data || hoje(), miniatura: escolhido.mini || '' };
    if (op.vincular) { reg.refTabela = op.vincular.tabela; reg.refId = op.vincular.id; }
    var nome = tipo + ' - ' + (cli.nome || '') + ' - ' + reg.data + ' - ' + escolhido.nome;
    mm.fechar();
    tarefa('Enviando para o Google Drive…', chamar('arquivo', { registro: reg, base64: escolhido.dados.split(',')[1], mime: escolhido.mime, nome: nome, vincular: op.vincular || null }))
      .then(function (r) {
        DB.arquivos = DB.arquivos || []; DB.arquivos.push(r.arquivo);
        if (r.vinculado) substituir(r.tabela, r.vinculado);
        aviso(op.vincular ? 'Documento em papel anexado.' : 'Arquivo guardado na pasta da cliente.'); recarregar();
      });
  };
}

/* ================================================================
   Relatório mensal para o escritório de contabilidade
   ================================================================ */
function dadosRelatorio(ym) {
  var l = DB.pagamentos.filter(function (x) { return String(x.data).slice(0, 7) === ym; }).sort(function (a, b) { return String(a.data).localeCompare(String(b.data)); });
  var porForma = {}, total = 0;
  l.forEach(function (x) { var k = x.forma || 'Não informado'; porForma[k] = (porForma[k] || 0) + num(x.valor); total += num(x.valor); });
  return { lista: l, porForma: porForma, total: total };
}
function referenciaPag(x) {
  var s = x.sessaoId ? porId(DB.sessoes, x.sessaoId) : null, o = x.orcamentoId ? porId(DB.orcamentos, x.orcamentoId) : null;
  if (s) return s.procedimento;
  if (o) return (o.itens || []).map(function (i) { return i.nome; }).join(', ') + ' (orç. ' + nOrc(o.numero) + ')';
  return x.obs || 'Avulso';
}
function docRelatorio(ym) {
  var r = dadosRelatorio(ym);
  var corpo = '<p>Período: <b>' + mesNome(ym) + '</b> &nbsp;·&nbsp; Emitido em ' + dataBR(hoje()) + (cfg('documento') ? ' &nbsp;·&nbsp; CPF/CNPJ: ' + esc(cfg('documento')) : '') + '</p>' +
    '<h2>Resumo por forma de pagamento</h2><table class="itens"><tr><th>Forma</th><th class="n">Qtde</th><th class="n">Valor</th></tr>' +
    Object.keys(r.porForma).sort().map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="n">' + r.lista.filter(function (x) { return (x.forma || 'Não informado') === k; }).length + '</td><td class="n">' + brl(r.porForma[k]) + '</td></tr>'; }).join('') +
    '<tr><td><b>Total</b></td><td class="n"><b>' + r.lista.length + '</b></td><td class="n"><b>' + brl(r.total) + '</b></td></tr></table>' +
    '<h2>Recebimentos do mês</h2><table class="itens"><tr><th>Data</th><th>Cliente</th><th>CPF</th><th>Referente a</th><th>Forma</th><th class="n">Valor</th></tr>' +
    r.lista.map(function (x) { var c = porId(DB.clientes, x.clienteId) || {}; return '<tr><td>' + dataBR(x.data) + '</td><td>' + esc(x.clienteNome) + '</td><td>' + esc(c.cpf || '') + '</td><td>' + esc(referenciaPag(x)) + '</td><td>' + esc(x.forma || '—') + '</td><td class="n">' + brl(x.valor) + '</td></tr>'; }).join('') +
    (r.lista.length ? '' : '<tr><td colspan="6">Nenhum recebimento no período.</td></tr>') + '</table>';
  return docBase('Relatório de recebimentos', corpo);
}
function csvRelatorio(ym) {
  var r = dadosRelatorio(ym);
  function c(v) { v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var linhas = [['Data', 'Cliente', 'CPF', 'Referente a', 'Forma de pagamento', 'Valor'].join(';')];
  r.lista.forEach(function (x) { var cl = porId(DB.clientes, x.clienteId) || {}; linhas.push([dataBR(x.data), x.clienteNome, cl.cpf, referenciaPag(x), x.forma, num(x.valor).toFixed(2).replace('.', ',')].map(c).join(';')); });
  linhas.push(''); linhas.push('Total;;;;;' + r.total.toFixed(2).replace('.', ','));
  return linhas.join('\r\n');
}
function formRelatorio(ym) {
  var r = dadosRelatorio(ym);
  var mm = modal('<h2>Relatório para o escritório</h2><p class="mute small" style="margin-top:-6px">Todos os recebimentos do mês, com cliente, CPF, procedimento e forma de pagamento. Vai em PDF e em planilha.</p>' +
    '<div class="lista-simples" style="margin-bottom:14px"><div><span>' + mesNome(ym) + '</span><b>' + brl(r.total) + '</b></div>' + Object.keys(r.porForma).map(function (k) { return '<div><span class="mute">' + esc(k) + '</span><span>' + brl(r.porForma[k]) + '</span></div>'; }).join('') + '</div>' +
    '<div class="stack" id="fr">' + campo('para', 'E-mail do escritório', cfg('emailContador'), 'email', '', 'placeholder="contabilidade@exemplo.com"') + '</div>' +
    '<div class="acoes"><button class="btn" id="ver">Ver e imprimir</button><button class="btn" id="drive">Salvar no Drive</button><button class="btn pri" id="env">' + ICON.email + ' Enviar ao escritório</button></div>');
  var nome = 'Relatório de recebimentos - ' + mesNome(ym);
  function salvar(para) {
    var corpo = 'Olá!<br><br>Segue o relatório de recebimentos de <b>' + mesNome(ym).toLowerCase() + '</b> (total ' + brl(r.total) + '), em PDF e em planilha.<br><br>Atenciosamente,<br>' + esc(cfg('nome', 'Débora Rodrigues'));
    return tarefa(para ? 'Enviando o relatório…' : 'Salvando no Drive…', chamar('relatorio', { html: docRelatorio(ym), csv: csvRelatorio(ym), nome: nome, para: para, assunto: nome + ' - ' + cfg('nome', 'Débora Rodrigues'), corpo: corpo }));
  }
  mm.querySelector('#ver').onclick = function () { mm.fechar(); previa(docRelatorio(ym), nome); };
  mm.querySelector('#drive').onclick = function () { mm.fechar(); salvar('').then(function (x) { aviso(x.demo ? 'Modo demonstração: seria salvo na pasta Relatórios do Drive.' : 'Salvo na pasta Relatórios do Drive.'); if (x.pdfUrl) window.open(x.pdfUrl, '_blank'); }); };
  mm.querySelector('#env').onclick = function () {
    var para = lerForm(mm.querySelector('#fr')).para;
    if (!para) { aviso('Informe o e-mail do escritório.', true); return; }
    mm.fechar();
    salvar(para).then(function (x) {
      if (para !== cfg('emailContador')) { DB.config.emailContador = para; chamar('salvarConfig', DB.config); }
      aviso(x.demo ? 'Modo demonstração: o relatório seria enviado para ' + para + '.' : 'Relatório enviado para ' + para + '.');
    });
  };
}

/* ================================================================
   Início
   ================================================================ */
function iniciar() {
  carregando('Abrindo o sistema…');
  chamar('carregar').then(function (d) { DB = d; DB.links = DB.links || {}; carregando(false); PILHA = []; ir('painel', {}, true); })
    .catch(function (e) { carregando(false); document.getElementById('main').innerHTML = '<div class="card"><h2>Não foi possível abrir o sistema</h2><p>' + esc(e.message) + '</p><button class="btn pri" onclick="iniciar()">Tentar de novo</button></div>'; });
}
iniciar();
</script>
